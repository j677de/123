name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            dir='.'
          elif [[ -f YongzheLocalServer_PE_GM_v5/settings.gradle && -f YongzheLocalServer_PE_GM_v5/app/build.gradle ]]; then
            dir='YongzheLocalServer_PE_GM_v5'
          else
            echo 'ERROR: Missing Android project. Upload extracted project files to the repository.' >&2
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "Project directory: $dir"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YongzheLocalServer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
