name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK location: $SDK_ROOT"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo 'ERROR: Android SDK not present on runner.' >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo 'ERROR: sdkmanager not found in preinstalled SDK.' >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            dir='.'
          elif [[ -f YongzheLocalServer_PE_GM_v5/settings.gradle && -f YongzheLocalServer_PE_GM_v5/app/build.gradle ]]; then
            dir='YongzheLocalServer_PE_GM_v5'
          else
            echo 'ERROR: Android project missing. Upload extracted source, not only the workflow YAML.' >&2
            find . -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "Found project: $dir"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YongzheLocalServer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
